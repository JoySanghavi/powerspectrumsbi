    estimator:
      _target_: falcon.contrib.SNPE_A
      embedding:
         _target_: model.E
         _input_: [x]
      # discard_samples: true
      net_type: zuko_gf # maf, nice, sospf, naf, gf
      gamma: 0.5
      num_epochs: 10
      batch_size: 128
      lr: 0.01
      early_stop_patience: 32
      lr_decay_factor: 0.1
      scheduler_patience: 16
    ray:
      num_gpus: 0.5

  pw:
    evidence: [x]
    parents: []
    simulator: 
      _target_: falcon.contrib.HypercubeMappingPrior
      priors: 
        - ['uniform', -4, -2]
        - ['uniform', -3.0, -2.0]
    estimator:
      _target_: falcon.contrib.SNPE_A
      embedding:
         _target_: model.E
         _input_: [x]
      # discard_samples: true
      net_type: zuko_gf # maf, nice, sospf, naf, gf
      gamma: 0.5
      num_epochs: 10
      batch_size: 128
      lr: 0.01
      early_stop_patience: 32
      lr_decay_factor: 0.1
      scheduler_patience: 16
    ray:
      num_gpus: 0.5

  gains:
    parents: [z]
    simulator: model.creategainfromtheta

  stacked_uv:
    parents: [gains]
    simulator: model.createuvmapfromgain

  noisestacked_uv:
    parents: [gains]
    simulator: model.createnoiseuvmapfromgain

  df:
    parents: [pw]
    simulator: model.createdffrompw

  bt:
    parents: [df]
    simulator: model.createbtfromdf

  image:
    parents: [bt]
    simulator: model.createimagefrombtandgauss
  
  uvimage:
    parents: [image]
    simulator: model.createuvimagefromimage

  noiseimage:
    parents: [uvimage]
    simulator: model.Noise

  tracked_uv:
    parents: [uvimage, stacked_uv]
    simulator: model.createsvfromuvimageandtracks

  normed_tracked_uv:
    parents: [tracked_uv]
    simulator: model.createnvfromsv

  noisetracked_uv:
    parents: [noiseimage, noisestacked_uv]
    simulator: model.createsvfromnoiseandtracks

  noisenormed_tracked_uv:
    parents: [noisetracked_uv]
    simulator: model.createnoisenvfromsv
  
  x:
    parents: [normed_tracked_uv, noisenormed_tracked_uv]
    simulator: model.createxfromnvandnoisenv
    observed: "data/normed_tracked_uv.npy"

